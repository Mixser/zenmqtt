[tool.poetry]
name = "zenmqtt"
version = "0.1.0"
description = "Asyncio MQTT 5 client: automatic reconnect, persistent sessions, acknowledgement after processing"
authors = ["Mikhail Turchunovich <mixser.by@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Mixser/zenmqtt"
repository = "https://github.com/Mixser/zenmqtt"
keywords = ["mqtt", "mqtt5", "asyncio", "iot", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = "^3.12"
opentelemetry-api = {version = ">=1.30,<2", optional = true}

[tool.poetry.extras]
otel = ["opentelemetry-api"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.10.1"
mypy = "^1.6.1"
isort = "^5.12.0"
flake8 = "^6.1.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
opentelemetry-sdk = "^1.45.1"


# benchmarks only: poetry install --with bench
pytest-benchmark = "^4.0"
[tool.poetry.group.bench]
optional = true

[tool.poetry.group.bench.dependencies]
aiomqtt = "^2.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-width=120