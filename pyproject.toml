[tool.poetry]
name = "zenmqtt"
version = "0.1.0rc6"
description = "Asyncio MQTT 5 client: automatic reconnect, persistent sessions, acknowledgement after processing"
authors = ["Mikhail Turchunovich <mixser.by@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Mixser/zenmqtt"
repository = "https://github.com/Mixser/zenmqtt"
keywords = ["mqtt", "mqtt5", "asyncio", "iot", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = "^3.12"
opentelemetry-api = {version = ">=1.30,<2", optional = true}

[tool.poetry.extras]
otel = ["opentelemetry-api"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
mypy = "^2.4.0"
ruff = "^0.17.0"
pytest-asyncio = "^1.4"
pytest-cov = "^7.1"
opentelemetry-sdk = "^1.45.1"


# benchmarks only: poetry install --with bench
pytest-benchmark = "^5.3"
[tool.poetry.group.bench]
optional = true

[tool.poetry.group.bench.dependencies]
aiomqtt = "^2.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
# the default line length of black, the code is formatted with it
line-length = 88

[tool.ruff.lint]
# the checks of flake8 (pyflakes, pycodestyle errors and warnings) and isort;
# not the defaults of ruff, they change between versions
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.pytest.ini_options]
# async tests run in an event loop without @pytest.mark.asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["zenmqtt"]
branch = true
# CI combines the data of several jobs
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
]

[tool.coverage.html]
# the published report lists all modules, also the fully covered ones
skip_covered = false
