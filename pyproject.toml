[tool.poetry]
name = "gmqtt"
version = "0.1.0"
description = ""
authors = ["Mikhail Turchunovich <mixser.by@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
opentelemetry-api = {version = ">=1.30,<2", optional = true}

[tool.poetry.extras]
otel = ["opentelemetry-api"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.10.1"
mypy = "^1.6.1"
isort = "^5.12.0"
flake8 = "^6.1.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
opentelemetry-sdk = "^1.45.1"


# benchmarks only: poetry install --with bench
[tool.poetry.group.bench]
optional = true

[tool.poetry.group.bench.dependencies]
aiomqtt = "^2.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-width=120