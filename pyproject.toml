[tool.poetry]
name = "zenmqtt"
version = "0.1.0"
description = "Asyncio MQTT 5 client: automatic reconnect, persistent sessions, acknowledgement after processing"
authors = ["Mikhail Turchunovich <mixser.by@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Mixser/zenmqtt"
repository = "https://github.com/Mixser/zenmqtt"
keywords = ["mqtt", "mqtt5", "asyncio", "iot", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = "^3.12"
opentelemetry-api = {version = ">=1.30,<2", optional = true}

[tool.poetry.extras]
otel = ["opentelemetry-api"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
black = "^23.10.1"
mypy = "^1.6.1"
isort = "^5.12.0"
flake8 = "^6.1.0"
pytest-asyncio = "^1.4"
pytest-cov = "^7.1"
opentelemetry-sdk = "^1.45.1"


# benchmarks only: poetry install --with bench
pytest-benchmark = "^5.3"
[tool.poetry.group.bench]
optional = true

[tool.poetry.group.bench.dependencies]
aiomqtt = "^2.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-width=120

[tool.pytest.ini_options]
# async tests run in an event loop without @pytest.mark.asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
