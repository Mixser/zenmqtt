name: zenmqtt

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # the publish workflow runs the tests before the release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Linting
        run: make lint

  testing:
    # tests don't run if the code doesn't pass linting
    needs: [ linting ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
    name: testing (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install
      - name: Testing
        env:
          COVERAGE_FILE: .coverage.unit-${{ matrix.python-version }}
        run: make test
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: .coverage.unit-${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error

  integration:
    # the client against a real broker, through the public API; runs only if
    # the unit tests pass on all Python versions
    needs: [ testing ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 \
            mosquitto -c /mosquitto-no-auth.conf
          timeout 30 sh -c 'until nc -z localhost 1883; do sleep 0.5; done'
      - name: Integration tests
        env:
          MQTT_INTEGRATION_URL: tcp://localhost:1883
          COVERAGE_FILE: .coverage.integration
        run: make test/integration
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    # unit tests on all Python versions and integration tests together
    needs: [ testing, integration ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install coverage
        run: pip install "coverage>=7.10"
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine
        run: |
          coverage combine .coverage.*
          coverage report
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage html
      - name: Badge
        # shields.io endpoint: https://shields.io/badges/endpoint-badge
        run: |
          python - <<'PY'
          import json, subprocess

          total = int(subprocess.check_output(["coverage", "report", "--format=total"]))
          colors = ((90, "brightgreen"), (80, "green"), (70, "yellowgreen"), (60, "yellow"))
          color = next((color for limit, color in colors if total >= limit), "red")
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{total}%", "color": color}

          with open("htmlcov/badge.json", "w") as file:
              json.dump(badge, file)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/

  coverage-pages:
    # the report and the badge of main: https://mixser.github.io/zenmqtt/coverage/
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ coverage ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-html
          path: htmlcov
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          rm -rf pages/coverage
          cp -r htmlcov pages/coverage
          # coverage writes a .gitignore which ignores the whole report
          rm -f pages/coverage/.gitignore

          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A coverage
          git diff --cached --quiet && exit 0
          git commit -q -m "Coverage of ${GITHUB_SHA}"

          # the benchmark history is pushed to gh-pages too: retry after it
          for attempt in 1 2 3 4 5; do
            git push -q origin gh-pages && exit 0
            sleep $((attempt * 2))
            git pull -q --rebase origin gh-pages
          done
          exit 1
