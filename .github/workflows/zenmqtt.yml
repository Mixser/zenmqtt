name: zenmqtt

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Linting
        run: make lint

  testing:
    # tests don't run if the code doesn't pass linting
    needs: [ linting ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14", "3.15" ]
    # 3.15 is new: failures are visible, but don't block merging
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    name: testing (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "poetry"
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install
      - name: Testing
        run: make test
