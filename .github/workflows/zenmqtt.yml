name: zenmqtt

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # the publish workflow runs the tests before the release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Linting
        run: make lint

  testing:
    # tests don't run if the code doesn't pass linting
    needs: [ linting ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
    name: testing (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install
      - name: Testing
        run: make test

  integration:
    # the client against a real broker, through the public API; runs only if
    # the unit tests pass on all Python versions
    needs: [ testing ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 \
            mosquitto -c /mosquitto-no-auth.conf
          timeout 30 sh -c 'until nc -z localhost 1883; do sleep 0.5; done'
      - name: Integration tests
        env:
          MQTT_INTEGRATION_URL: tcp://localhost:1883
        run: make test/integration
