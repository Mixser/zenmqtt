name: zenmqtt

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # the publish workflow runs the tests before the release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Linting
        run: make lint

  testing:
    # tests don't run if the code doesn't pass linting
    needs: [ linting ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
    name: testing (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install
      - name: Testing
        env:
          COVERAGE_FILE: .coverage.unit-${{ matrix.python-version }}
        run: make test
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: .coverage.unit-${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error

  integration:
    # the client against a real broker, through the public API; runs only if
    # the unit tests pass on all Python versions
    needs: [ testing ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 \
            mosquitto -c /mosquitto-no-auth.conf
          timeout 30 sh -c 'until nc -z localhost 1883; do sleep 0.5; done'
      - name: Integration tests
        env:
          MQTT_INTEGRATION_URL: tcp://localhost:1883
          COVERAGE_FILE: .coverage.integration
        run: make test/integration
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    # unit tests on all Python versions and integration tests together
    needs: [ testing, integration ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install coverage
        run: pip install "coverage>=7.10"
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine
        run: |
          coverage combine .coverage.*
          coverage report
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage html
      - name: Badge
        # shields.io endpoint: https://shields.io/badges/endpoint-badge
        run: |
          python - <<'PY'
          import json, subprocess

          total = int(subprocess.check_output(["coverage", "report", "--format=total"]))
          colors = ((90, "brightgreen"), (80, "green"), (70, "yellowgreen"), (60, "yellow"))
          color = next((color for limit, color in colors if total >= limit), "red")
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{total}%", "color": color}

          with open("htmlcov/badge.json", "w") as file:
              json.dump(badge, file)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/

  compare:
    # performance of the pull request against its base, by benchmarks/compare.py;
    # a manual step: it waits for an approval in the "benchmarks" environment
    # (the run page -> Review deployments). perf-comment.yml posts the report.
    # It runs code of the pull request, so it has only read access.
    if: github.event_name == 'pull_request'
    needs: [ testing, integration ]
    environment: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # the merge commit of the pull request into the current base
      - name: Checkout the pull request
        uses: actions/checkout@v7
        with:
          path: head
          fetch-depth: 2

      # its first parent: the only difference between both sides is the
      # pull request
      - name: Checkout the base
        run: git -C head worktree add ../base HEAD^1

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"
          cache-dependency-path: head/poetry.lock

      - name: Install dependencies
        working-directory: head
        run: |
          poetry env use python
          poetry install

      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 \
            mosquitto -c /mosquitto-no-auth.conf
          timeout 30 bash -c 'until (echo > /dev/tcp/localhost/1883) 2>/dev/null; do sleep 1; done'

      - name: Compare
        working-directory: head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          base_sha=$(git rev-parse --short HEAD^1)
          head_sha=$(git rev-parse --short HEAD)
          poetry run python -m benchmarks.compare \
            --base ../base \
            --head . \
            --base-label "main ${base_sha}" \
            --head-label "#${PR_NUMBER} merged ${head_sha}" \
            --scenarios in-memory,codec,publish,end-to-end \
            --url tcp://localhost:1883 \
            --rounds 10 \
            --output-dir ../perf-report

      - name: Job summary
        run: cat perf-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the pull request number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "$PR_NUMBER" > perf-report/pr-number
          echo "$HEAD_SHA" > perf-report/head-sha

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: perf-report
          retention-days: 30
