# MQTT 5 broker for the integration tests, the examples and the benchmarks:
# make broker/up, make broker/down
services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
    healthcheck:
      # healthy when the broker accepts a connection
      test: ["CMD", "mosquitto_pub", "-t", "healthcheck", "-m", "ok"]
      interval: 1s
      timeout: 3s
      retries: 30
